name: Web CI

# Dokploy builds and runs the app: dev -> staging app, main -> production app.
# Dokploy is reachable only inside the Tailscale tailnet, so GitHub cannot call
# its webhook directly: after the image builds, a push to dev joins the tailnet
# as an ephemeral `tag:ci` node (OIDC workload identity, no stored Tailscale
# secret; the tailnet policy lets tag:ci reach only Dokploy's port 3000) and
# calls the staging app's deploy webhook.
on:
  pull_request:
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and formatting report. main still has existing lint/format debt, so
  # this job is informational until it passes.
  check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --filter abasto-web
      - run: bun run web:lint
      - run: bun run web:check

  # Same Dockerfile Dokploy builds: catches a broken image before it deploys.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: abasto-web/Dockerfile
          push: false
          cache-from: type=gha,scope=abasto-web
          cache-to: type=gha,mode=max,scope=abasto-web

  # Staging deploy: only for pushes to dev whose image built.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Full history so the changed files of the push can be listed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: Trigger the Dokploy staging deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL || vars.DOKPLOY_WEBHOOK_URL }}
        # The staging app's source is GitHub: Dokploy deploys only a GitHub push
        # event (header + payload with the branch and changed files), and answers
        # 301 "Branch Not Match" to anything else, so the push payload is forwarded
        # (with the changed files added); 200 deploys, a push outside the app's watch paths is skipped, and
        # anything else fails the job.
        run: |
          test -n "$DOKPLOY_WEBHOOK_URL" || { echo 'DOKPLOY_WEBHOOK_URL is not set'; exit 1; }
          # The Actions push payload carries no file lists in its commits, which
          # Dokploy needs to match its watch paths: add the files the push changed.
          before=$(jq -r .before "$GITHUB_EVENT_PATH")
          git cat-file -e "$before^{commit}" 2>/dev/null || before=$(git rev-parse HEAD~1)
          git diff --name-only "$before" HEAD | jq -R . | jq -s . > files.json
          echo "Files changed by the push: $(jq length files.json)"
          jq --slurpfile files files.json \
            '.commits = [{id: .after, message: (.head_commit.message // ""), added: [], removed: [], modified: $files[0]}]' \
            "$GITHUB_EVENT_PATH" > payload.json
          status=$(curl --silent --show-error --max-time 30 -o response.json -w '%{http_code}' \
            -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary @payload.json)
          echo "Dokploy answered $status: $(cat response.json)"
          # The app's watch paths decide what deploys: a push outside them is skipped on purpose.
          if [ "$status" = 301 ] && grep -q 'Watch Paths Not Match' response.json; then
            echo '::notice::No deploy: the push changed nothing under the staging app watch paths.'
            exit 0
          fi
          test "$status" = 200
